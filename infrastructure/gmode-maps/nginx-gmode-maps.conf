server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /opt/gmode-maps;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-Range" always;
    add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag, Last-Modified" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /health.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /maps/ {
        types {
            application/vnd.pmtiles pmtiles;
        }
        default_type application/octet-stream;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-Range" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag, Last-Modified" always;
        add_header Accept-Ranges "bytes" always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 200 "GMODE local map service\n";
    }
}
