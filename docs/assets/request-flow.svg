<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Jarvis request flow</title>
  <desc id="desc">User request flows through Home Assistant or the console to Jarvis, then to tools and the local model server.</desc>
  <defs>
    <style>
      .bg{fill:#0b0f12}.box{fill:#12191f;stroke:#2b3a45;stroke-width:2}.text{fill:#e8edf2;font:600 18px Arial,sans-serif}.small{fill:#aab7c4;font:14px Arial,sans-serif}.line{stroke:#76a9ff;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#76a9ff"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="300"/>
  <rect class="box" x="34" y="92" width="160" height="96" rx="8"/>
  <text class="text" x="68" y="132">User</text>
  <text class="small" x="64" y="160">voice or text</text>
  <rect class="box" x="242" y="42" width="180" height="86" rx="8"/>
  <text class="text" x="276" y="80">Console</text>
  <text class="small" x="272" y="106">run_app.py</text>
  <rect class="box" x="242" y="172" width="180" height="86" rx="8"/>
  <text class="text" x="276" y="210">Assist</text>
  <text class="small" x="274" y="236">optional webhook</text>
  <rect class="box" x="480" y="92" width="180" height="96" rx="8"/>
  <text class="text" x="522" y="132">Jarvis</text>
  <text class="small" x="512" y="160">tools and memory</text>
  <rect class="box" x="728" y="92" width="190" height="96" rx="8"/>
  <text class="text" x="760" y="132">LLM Server</text>
  <text class="small" x="760" y="160">Ollama / OpenAI API</text>
  <path class="line" d="M194 126 L242 92"/>
  <path class="line" d="M194 156 L242 206"/>
  <path class="line" d="M422 85 C450 85 452 140 480 140"/>
  <path class="line" d="M422 215 C450 215 452 140 480 140"/>
  <path class="line" d="M660 140 H728"/>
</svg>
