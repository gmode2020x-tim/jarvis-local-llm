<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Jarvis local LLM architecture</title>
  <desc id="desc">Workstation runtime connects to a local or LAN Ollama server, optional Home Assistant, and local memory.</desc>
  <defs>
    <style>
      .bg{fill:#0b0f12}.panel{fill:#12191f;stroke:#2b3a45;stroke-width:2}.accent{fill:#58d6a3}.blue{fill:#76a9ff}.text{fill:#e8edf2;font:600 20px Arial,sans-serif}.small{fill:#aab7c4;font:15px Arial,sans-serif}.line{stroke:#58d6a3;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58d6a3"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="420" rx="0"/>
  <rect class="panel" x="42" y="76" width="250" height="260" rx="8"/>
  <text class="text" x="72" y="122">Jarvis Workstation</text>
  <text class="small" x="72" y="158">Python runtime</text>
  <text class="small" x="72" y="184">Browser console</text>
  <text class="small" x="72" y="210">Tools and memory</text>
  <text class="small" x="72" y="236">Dataset prep</text>
  <rect class="panel" x="360" y="76" width="250" height="260" rx="8"/>
  <text class="text" x="390" y="122">LLM Host</text>
  <text class="small" x="390" y="158">Ollama or compatible API</text>
  <text class="small" x="390" y="184">/v1/chat/completions</text>
  <text class="small" x="390" y="210">Model keep-alive</text>
  <text class="small" x="390" y="236">Optional SSH inspection</text>
  <rect class="panel" x="678" y="76" width="240" height="120" rx="8"/>
  <text class="text" x="708" y="122">Home Assistant</text>
  <text class="small" x="708" y="158">Optional Assist bridge</text>
  <rect class="panel" x="678" y="216" width="240" height="120" rx="8"/>
  <text class="text" x="708" y="262">Local Data</text>
  <text class="small" x="708" y="298">Memory, notes, runs</text>
  <path class="line" d="M292 176 H352"/>
  <path class="line" d="M610 154 H670"/>
  <path class="line" d="M292 260 C420 360 548 360 670 286"/>
  <circle class="accent" cx="320" cy="176" r="5"/>
  <circle class="blue" cx="638" cy="154" r="5"/>
</svg>
